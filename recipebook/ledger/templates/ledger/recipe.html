{% extends "ledger/base_ledger.html" %} 

{% block app_content %}
  <h4>{{ recipe.name }} Ingredients</h4>
    
  <ul>
    {% for r in recipe.ingredients.all %}
      <li>
        <p> <strong>Name:</strong> {{ r.ingredient.name }} </p>
        <p> <strong>Quantity:</strong> {{ r.quantity }} </p>
      </li>
    {% endfor %}
  </ul>

{% endblock %}
