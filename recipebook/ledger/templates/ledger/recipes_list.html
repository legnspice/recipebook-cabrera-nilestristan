{% extends "ledger/base_ledger.html" %} 

{% block heading %}
  Recipe List Page
{% endblock %}

{% block app_content %}
  {% if user.is_authenticated %}
    <a href="{% url 'ledger:recipe-create' %}">Create a recipe</a>
  {% endif %}

  {% for recipe in recipes %}
    <h4>{{ recipe.name }}</h4>
    <img src="{{ recipe.recipe_image.url }}" alt="">
    <a href="{{ recipe.get_absolute_url }}">LINK TO RECIPE</a>
  {% endfor %}
{% endblock %}
